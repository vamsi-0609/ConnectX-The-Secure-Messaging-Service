<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Runs synchronously before first paint, so the system status bar (via the
        // theme-color meta tag below, kept in sync at runtime by utils/theme.ts's
        // applyTheme()) is never briefly wrong on load -- same source of truth
        // (connectx_theme) as the dark/light class toggle right below it.
        var theme = localStorage.getItem('connectx_theme');
        var isDark = theme !== 'light';
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', isDark ? '#090d16' : '#f1f5f9');
        }
      })();
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Default matches ConnectX's default (dark) shell background (--bg-main / bg-slate-100
         dark:bg-[#090d16] in App.tsx); the inline script above corrects this synchronously
         before paint if the stored preference is 'light', and utils/theme.ts's applyTheme()
         keeps it in sync on every runtime theme toggle. Never left as a static brand-purple
         value -- that was the entire cause of the violet system status bar. -->
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="ConnectX — Real-time end-to-end encrypted secure messaging. Chat privately with full encryption." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConnectX" />
    <meta name="application-name" content="ConnectX" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <title>ConnectX - Secure E2EE Messaging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 dark:bg-[#090d16] text-slate-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
