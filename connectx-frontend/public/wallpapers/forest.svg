<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="130" />
    </filter>
  </defs>
  <!-- Deep evergreen dark green -->
  <rect width="1200" height="1600" fill="#022c22" />
  
  <g filter="url(#blur)">
    <!-- Deep Emerald -->
    <circle cx="300" cy="350" r="500" fill="#064e3b" opacity="0.75" />
    <!-- Moss Green -->
    <circle cx="950" cy="1300" r="550" fill="#14532d" opacity="0.65" />
    <!-- Sage/Mint -->
    <ellipse cx="200" cy="1100" rx="450" ry="500" fill="#059669" opacity="0.5" />
    <!-- Soft Sunlight Lime/Gold -->
    <ellipse cx="850" cy="400" rx="450" ry="400" fill="#84cc16" opacity="0.35" />
  </g>
</svg>
