<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="110" />
    </filter>
  </defs>
  <!-- Light elegant background -->
  <rect width="1200" height="1600" fill="#f8fafc" />
  
  <g filter="url(#blur)">
    <!-- Soft Warm Gray / Sand -->
    <circle cx="200" cy="300" r="450" fill="#f1f5f9" opacity="0.9" />
    <circle cx="1000" cy="1300" r="500" fill="#e2e8f0" opacity="0.85" />
    <!-- Soft Cool Slate -->
    <ellipse cx="150" cy="1100" rx="400" ry="500" fill="#cbd5e1" opacity="0.6" />
    <!-- Neutral muted sand -->
    <ellipse cx="900" cy="400" rx="450" ry="400" fill="#cbd5e1" opacity="0.45" />
  </g>
</svg>
