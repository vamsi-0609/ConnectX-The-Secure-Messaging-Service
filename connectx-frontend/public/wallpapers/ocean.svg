<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="125" />
    </filter>
  </defs>
  <!-- Deep abyss blue -->
  <rect width="1200" height="1600" fill="#030712" />
  
  <g filter="url(#blur)">
    <!-- Deep Royal Navy -->
    <circle cx="200" cy="400" r="500" fill="#1e3a8a" opacity="0.7" />
    <!-- Marine Teal -->
    <circle cx="1000" cy="1300" r="550" fill="#0f766e" opacity="0.6" />
    <!-- Vibrant Blue -->
    <ellipse cx="150" cy="1100" rx="450" ry="500" fill="#2563eb" opacity="0.55" />
    <!-- Bright Cyan/Mint -->
    <ellipse cx="900" cy="300" rx="400" ry="450" fill="#06b6d4" opacity="0.45" />
  </g>
</svg>
