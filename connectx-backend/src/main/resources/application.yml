server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: connectx-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/connectx_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 18MB

connectx:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItY29ubmVjdHgtc2VjdXJlLW1lc3NhZ2luZy1zZXJ2aWNlLTIwMjY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  upload:
    profile-dir: ${CONNECTX_PROFILE_UPLOAD_DIR:uploads/profiles}
    media-dir: ${CONNECTX_MEDIA_UPLOAD_DIR:uploads/media}

logging:
  level:
    root: INFO
    com.connectx: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
